name: Nightly APK Build

on:
  schedule:
    - cron: "0 * * * *"  # runs every 1 hour
  workflow_dispatch:
    inputs:
      generate_release_description:
        description: "Generate an AI-powered GitHub release description"
        required: false
        type: boolean
        default: true
      generate_whats_new:
        description: "Generate AI-powered What's New content for onboarding"
        required: false
        type: boolean
        default: true
      include_geckoview:
        description: "Include GeckoView APKs in the nightly release"
        required: false
        type: boolean
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check_commits
        run: |
          LATEST_NIGHTLY=$(gh release list --exclude-drafts --limit 1 | awk 'tolower($0) ~ /nightly/ {print $1}' | cut -d'-' -f1)
          LATEST_COMMIT=$(git rev-parse --short HEAD)
          echo "Latest nightly: $LATEST_NIGHTLY"
          echo "Current commit: $LATEST_COMMIT"
          if [ "$LATEST_NIGHTLY" = "$LATEST_COMMIT" ]; then
            echo "No new commits since last nightly build"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "New commits found, building new nightly"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Node.js
        if: steps.check_commits.outputs.skip_build != 'true'
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Setup Java
        if: steps.check_commits.outputs.skip_build != 'true'
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        if: steps.check_commits.outputs.skip_build != 'true'
        run: npm install

      - name: Decode Keystore
        if: steps.check_commits.outputs.skip_build != 'true'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
      
      - name: Create local.properties
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "$LOCAL_PROPERTIES" > android/gradle.local.properties
          LATEST_NIGHTLY=$(gh release list --exclude-drafts --limit 1 | awk 'tolower($0) ~ /nightly/ {print $1}' | cut -d'-' -f1)
          CHANGELOG=$(git log ${LATEST_NIGHTLY}..HEAD --pretty=format:"<strong>%h</strong> %s{NEWLINE}" | tr '\n' '\\n')
          echo "CHANGELOG=$CHANGELOG" >> android/gradle.local.properties

      - name: Generate What's New with Gemini
        id: whats_new
        if: ${{ steps.check_commits.outputs.skip_build != 'true' && (github.event_name != 'workflow_dispatch' || inputs.generate_whats_new) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LAST_NIGHTLY=$(git tag -l '*-nightly' --sort=-creatordate | head -1)
          if [ -n "$LAST_NIGHTLY" ]; then
            COMMITS=$(git log "${LAST_NIGHTLY}..HEAD" --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges -20)
          fi

          PROMPT="Based on these git commits, generate a 'What's New' HTML list for a Disco Launcher nightly build. ONLY include changes that directly affect end users (new features, UI improvements, bug fixes users would notice). EXCLUDE technical changes like code refactoring, build system updates, dependency updates, or developer-only improvements. Format as HTML <li> elements with <strong> tags for feature names. If no user-facing changes are found, return an empty string. IMPORTANT: Return ONLY the HTML content without markdown code blocks. Here are the commits:\n\n${COMMITS}"
          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"contents\":[{\"parts\":[{\"text\":${ESCAPED_PROMPT}}]}]}")
          WHATS_NEW_HTML=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")

          if [ -n "$WHATS_NEW_HTML" ] && [ "$WHATS_NEW_HTML" != "null" ]; then
            echo "$WHATS_NEW_HTML" > whats_new.html
            node scripts/update-welcome.js "$WHATS_NEW_HTML"
            echo "whats_new_generated=true" >> $GITHUB_OUTPUT
          else
            echo "whats_new_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APKs
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          npm run build:android:nightly:webview
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.include_geckoview }}" = "true" ]; then
            npm run build:android:nightly:geckoview
          fi

      - name: List all generated APKs for debugging
        if: steps.check_commits.outputs.skip_build != 'true'
        run: |
          echo "Listing all APKs in build directory:"
          find android/app/build/ -name "*.apk" -print

      - name: Rename and Collect APKs for Release
        if: steps.check_commits.outputs.skip_build != 'true'
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          RELEASE_TAG="${COMMIT_ID}-nightly"
          # WebView APKs (split by ABI)
          for apk in android/app/build/outputs/apk/nightly/release/app-nightly-*-release.apk; do
            arch=$(echo $apk | sed -n 's/.*app-nightly-\(.*\)-release.apk/\1/p')
            cp "$apk" "DiscoLauncher_${RELEASE_TAG}_WebView_${arch}.apk"
          done
          # GeckoView APKs (split by ABI)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.include_geckoview }}" = "true" ]; then
            for apk in android/app/build/outputs/apk/nightlyGeckoView/release/app-nightlyGeckoView-*-release.apk; do
              arch=$(echo $apk | sed -n 's/.*app-nightlyGeckoView-\(.*\)-release.apk/\1/p')
              cp "$apk" "DiscoLauncher_${RELEASE_TAG}_GeckoView_${arch}.apk"
            done
          fi

      - name: Generate release description with Gemini
        id: release_description
        if: ${{ steps.check_commits.outputs.skip_build != 'true' && (github.event_name != 'workflow_dispatch' || inputs.generate_release_description) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LAST_NIGHTLY=$(git tag -l '*-nightly' --sort=-creatordate | head -1)
          if [ -n "$LAST_NIGHTLY" ]; then
            COMMITS=$(git log "${LAST_NIGHTLY}..HEAD" --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges -20)
          fi

          PROMPT="Based on these git commits, generate a concise GitHub release description in markdown for a Disco Launcher nightly build. Only include user-facing Added, Improved, and Fixed categories that have actual changes. Format each item as '- **feature name**: Description'. Do not include a Full Changelog link or markdown code fences. Here are the commits:\n\n${COMMITS}"
          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{\"contents\":[{\"parts\":[{\"text\":${ESCAPED_PROMPT}}]}]}")
          RELEASE_NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' 2>/dev/null || echo "")

          if [ -n "$RELEASE_NOTES" ] && [ "$RELEASE_NOTES" != "null" ]; then
            echo "$RELEASE_NOTES" > release_description.md
            echo "release_notes_generated=true" >> $GITHUB_OUTPUT
          else
            echo "release_notes_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete Previous Nightly Releases
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          echo "Listing and deleting previous nightly releases"
          for tag in $(gh release list --exclude-drafts --limit 100 | awk 'tolower($0) ~ /nightly/ {print $1}'); do
            echo "Deleting release: $tag"
            gh release delete "$tag" -y
          done

      - name: Create Nightly Release
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          COMMIT_ID=$(git rev-parse --short HEAD)
          RELEASE_TAG="${COMMIT_ID}-nightly"
          RELEASE_NAME="${COMMIT_ID}-nightly"
          ASSETS=$(ls DiscoLauncher_${RELEASE_TAG}_*.apk | xargs)
          echo "Creating release with tag $RELEASE_TAG"
          if [ "${{ steps.release_description.outputs.release_notes_generated }}" = "true" ] && [ -f release_description.md ]; then
            gh release create "$RELEASE_TAG" $ASSETS \
              --title "$RELEASE_NAME" \
              --notes-file release_description.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" $ASSETS \
              --title "$RELEASE_NAME" \
              --notes "Nightly build for $(date -u)" \
              --prerelease
          fi
